# OpenWA — passerelle WhatsApp auto-hébergée pour l'application école.
# https://github.com/rmyndharis/OpenWA
#
# Démarrage :   docker compose -f openwa/docker-compose.yml up -d
# Tableau de bord : http://localhost:2785
#
# Voir openwa/README.md pour la procédure complète (clé API, session, QR code).

services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: openwa
    restart: unless-stopped
    # Chromium (moteur whatsapp-web.js) a besoin d'un /dev/shm large, sinon
    # l'onglet WhatsApp Web crashe au bout de quelques minutes.
    shm_size: 1gb
    # La montée en route d'une session prend du temps ; laisser Docker fermer
    # proprement évite d'orphaniser le profil Chromium de la session.
    stop_grace_period: 45s
    ports:
      # Exposé sur la loopback uniquement. Pour un déploiement distant, mettre
      # un reverse-proxy TLS devant plutôt que d'ouvrir ce port publiquement.
      - '127.0.0.1:${OPENWA_PORT:-2785}:2785'
    environment:
      - NODE_ENV=production
      - PORT=2785
      # SQLite + stockage local : aucune dépendance externe, tout tient dans le
      # volume ci-dessous.
      - DATABASE_TYPE=sqlite
      # whatsapp-web.js = risque de bannissement plus faible que baileys, au prix
      # de ~300-500 Mo de RAM par session. Voir les avertissements du README amont.
      - ENGINE_TYPE=whatsapp-web.js
      # Clé maîtresse de l'API. À définir dans openwa/.env — c'est elle qui ouvre
      # le tableau de bord et l'API. Ne jamais la committer.
      - API_MASTER_KEY=${API_MASTER_KEY:?definir API_MASTER_KEY dans openwa/.env}
      # Garde-fou anti-bannissement : quelques messages par minute suffisent
      # largement pour des alertes de solde, et restent sous le radar de WhatsApp.
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-20}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
    volumes:
      # Contient l'authentification des sessions WhatsApp, la base SQLite, les
      # médias. Perdre ce volume = devoir rescanner le QR code et recréer les clés.
      - openwa-data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:2785/api/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  openwa-data:
