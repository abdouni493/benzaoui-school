# Overlay GRATUIT : expose la passerelle locale à Internet via ngrok, pour que le
# site Vercel puisse l'atteindre — SANS VPS ni nom de domaine à acheter.
#
# À superposer au compose de dev local (openwa/docker-compose.yml) : le service
# ngrok rejoint le même réseau et relaie vers le conteneur `openwa` en interne.
# La passerelle reste liée à 127.0.0.1 côté hôte ; seul ngrok fournit l'accès
# public, protégé par la clé opérateur (X-API-Key).
#
# Prérequis (compte ngrok GRATUIT — voir openwa/FREE-TUNNEL.md) :
#   openwa/.env doit contenir :
#     NGROK_AUTHTOKEN=<votre authtoken ngrok>
#     NGROK_DOMAIN=<votre-domaine-statique-gratuit>.ngrok-free.app
#
# Démarrer (passerelle + tunnel) :
#   docker compose -f openwa/docker-compose.yml -f openwa/docker-compose.tunnel.yml --env-file openwa/.env up -d
#
# L'URL publique STABLE est alors https://$NGROK_DOMAIN (survit aux redémarrages)
# -> à mettre dans OPENWA_BASE_URL côté Vercel.
#
# ⚠️ Le PC doit rester allumé, avec Docker et ce conteneur en marche, pour que le
# site en ligne puisse envoyer des WhatsApp.

services:
  ngrok:
    image: ngrok/ngrok:latest
    container_name: openwa-ngrok
    restart: unless-stopped
    depends_on:
      - openwa
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:?definir NGROK_AUTHTOKEN dans openwa/.env}
    # `ngrok http` est l'entrypoint de l'image ; on lui passe la cible + le
    # domaine statique réservé. (Agent ngrok v3 : --url=https://<domaine>.)
    command: http openwa:2785 --url=https://${NGROK_DOMAIN:?definir NGROK_DOMAIN dans openwa/.env}
