# Déploiement PRODUCTION de la passerelle OpenWA sur un serveur public (VPS).
#
# Différence avec openwa/docker-compose.yml (développement local, lié à
# 127.0.0.1) : ici OpenWA tourne DERRIÈRE un reverse-proxy TLS (Caddy) pour que
# Vercel puisse l'atteindre en HTTPS. OpenWA n'est PAS publié sur l'hôte — seul
# Caddy (443) est public ; l'API n'est joignable qu'à travers le proxy et reste
# protégée par la clé opérateur (X-API-Key).
#
# Prérequis :
#   - un domaine (ex. wa.mon-ecole.dz) avec un enregistrement A vers l'IP du VPS
#   - ports 80 et 443 ouverts
#   - openwa/.env présent sur le VPS avec API_MASTER_KEY et OPENWA_DOMAIN
#
# Démarrage :
#   docker compose -f openwa/docker-compose.prod.yml --env-file openwa/.env up -d

services:
  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    container_name: openwa
    restart: unless-stopped
    # Chromium (whatsapp-web.js) a besoin d'un /dev/shm large, sinon l'onglet
    # WhatsApp Web crashe au bout de quelques minutes.
    shm_size: 1gb
    stop_grace_period: 45s
    # Pas de `ports:` — le conteneur n'est joignable QUE par Caddy sur le réseau
    # interne du compose. Ne jamais publier 2785 directement sur l'hôte.
    expose:
      - '2785'
    environment:
      - NODE_ENV=production
      - PORT=2785
      - DATABASE_TYPE=sqlite
      - ENGINE_TYPE=whatsapp-web.js
      - API_MASTER_KEY=${API_MASTER_KEY:?definir API_MASTER_KEY dans openwa/.env}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-20}
      - RATE_LIMIT_WINDOW_MS=${RATE_LIMIT_WINDOW_MS:-60000}
    volumes:
      # Authentification des sessions WhatsApp + base SQLite + clés API.
      # Perdre ce volume = rescanner le QR code et recréer les clés.
      - openwa-data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:2785/api/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    image: caddy:2
    container_name: openwa-caddy
    restart: unless-stopped
    depends_on:
      - openwa
    ports:
      - '80:80'
      - '443:443'
    environment:
      # ex. wa.mon-ecole.dz — doit résoudre vers ce serveur.
      - OPENWA_DOMAIN=${OPENWA_DOMAIN:?definir OPENWA_DOMAIN dans openwa/.env (ex. wa.mon-ecole.dz)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  openwa-data:
  caddy-data:
  caddy-config:
